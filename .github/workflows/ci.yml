name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scala: ["3.9.0"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up sbt
        uses: sbt/setup-sbt@v1
        with:
          # Pin the runner to match project/build.properties (see the
          # dependabot ignore in .github/dependabot.yml).
          sbt-runner-version: 2.0.7
          # Never restore the shared ~/.cache/sbt disk cache. Its key is
          # OS+JDK only — not the sbt version — so a cache written by a newer
          # sbt makes `test` silently run as `testQuick`, discover zero suites
          # ("Total 0"), and emit no scoverage data. A clean boot cache fixes
          # it; the runner distribution above is still cached separately.
          disk-cache: false
      - name: Cache coursier and ivy
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.ivy2/cache
            ~/.sbt
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', 'project/build.properties', 'project/plugins.sbt') }}
          restore-keys: |
            ${{ runner.os }}-sbt-
      - name: Compile
        run: sbt "++${{ matrix.scala }}; compile"
      - name: Test with coverage
        run: sbt "++${{ matrix.scala }}; clean; coverage; Test/test; coverageReport"
      - name: Coverage summary
        run: |
          report=$(find . -name "scoverage.xml" | head -1)
          if [ -z "$report" ]; then
            echo "::error::coverage report not found at $report"
            exit 1
          fi
          python3 -c "
          import xml.etree.ElementTree as ET, sys
          t = ET.parse('$report')
          root = t.getroot()
          print('statement-rate:', root.get('statement-rate'))
          print('branch-rate:   ', root.get('branch-rate'))
          "
