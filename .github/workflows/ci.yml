name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scala: ["3.8.4"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up sbt
        uses: sbt/setup-sbt@v1
      - name: Cache coursier and ivy
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.ivy2/cache
            ~/.sbt
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', 'project/build.properties', 'project/plugins.sbt') }}
          restore-keys: |
            ${{ runner.os }}-sbt-
      - name: Compile
        run: sbt "++${{ matrix.scala }}; compile"
      - name: Test with coverage
        run: sbt "++${{ matrix.scala }}; clean; coverage; test; coverageReport"
      - name: Coverage summary
        run: |
          report=target/out/jvm/scala-${{ matrix.scala }}/voicetel-sdk/scoverage-report/scoverage.xml
          if [ ! -f "$report" ]; then
            echo "::error::coverage report not found at $report"
            exit 1
          fi
          python3 -c "
          import xml.etree.ElementTree as ET, sys
          t = ET.parse('$report')
          root = t.getroot()
          print('statement-rate:', root.get('statement-rate'))
          print('branch-rate:   ', root.get('branch-rate'))
          "
